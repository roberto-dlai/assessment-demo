<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assessment</title>

    <!-- Fonts: Poppins (headings/CTAs), Open Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Brand tokens then app styles (relative paths — GitHub Pages subpath-safe) -->
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>

    <header class="site-header">
      <!-- Logo placeholder: swap in the official coral horizontal DeepLearning.AI
           lockup (one color, no distortion) per SPEC §8. -->
      <span class="site-header__logo" aria-label="DeepLearning.AI">DeepLearning.AI</span>
    </header>

    <main id="app" class="app">
      <!-- Screens render here -->
      <p class="app__loading" role="status">Loading assessment…</p>
    </main>

    <!-- Live regions for assistive tech (SPEC §4.6) -->
    <div id="live-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="live-assertive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
